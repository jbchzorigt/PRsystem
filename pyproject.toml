[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prsystem-core"
version = "0.10.0"
description = "Hotel platform domain controls: expiry, cash reservations, settlement"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.5"]
api = ["psycopg[binary]==3.3.5", "fastapi==0.141.1", "uvicorn==0.52.4", "argon2-cffi==25.1.0", "email-validator==2.3.0", "cryptography==50.0.1"]
test = ["httpx2==2.12.0"]

[tool.setuptools.package-data]
"prsystem" = ["static/*.html", "static/*.css", "static/*.js"]
"prsystem.postgres" = ["migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]
