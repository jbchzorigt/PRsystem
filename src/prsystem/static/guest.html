<!doctype html>
<html lang="mn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Зочны нэвтрэх — PRsystem</title><link rel="stylesheet" href="/staff/assets/staff.css"><link rel="stylesheet" href="/staff/assets/reception.css"><script src="/staff/assets/reception.js" defer></script></head>

<header><span class="brand">PRsystem</span><span>Зочны үйлчилгээ</span><button disabled type="button" id="logout" class="secondary" hidden>Гарах</button></header>
<main id="workspace" tabindex="-1"><div class="rail" aria-hidden="true"></div><div class="console">

</div></div></main>

<footer>Цагийг Улаанбаатарын цагаар харуулна. Мөнгөн дүн төгрөгөөр.</footer>
