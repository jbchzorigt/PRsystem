# Local development topology — docs/architecture/02-container-and-deployment.md.
#
# These credentials are local-development defaults only. They are non-secret by
# construction: the stack binds to 127.0.0.1 and is never used outside a developer
# machine or CI. Production credentials come from a secret manager and never appear
# in a compose file or in .env.example.

name: prsystem

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prsystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prsystem_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-prsystem}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55442}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-prsystem} -d ${POSTGRES_DB:-prsystem}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '127.0.0.1:${REDIS_PORT:-56379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:-prsystem_local}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-prsystem_local_dev}
    ports:
      - '127.0.0.1:${MINIO_PORT:-59000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${SMTP_PORT:-51025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
