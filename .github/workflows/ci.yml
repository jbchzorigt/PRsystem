name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.17.0'
  PNPM_VERSION: '9.15.9'

jobs:
  governance:
    name: governance and workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The validators below are pnpm scripts that import js-yaml. Without an
      # install this job passes only on a machine that already has node_modules,
      # which a clean runner does not.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Validate governance documents
        run: node tools/validate-governance.mjs
      - name: Validate workspace structure
        run: node tools/validate-workspace.mjs
      - name: Validate regression coverage
        run: pnpm run validate:regression-coverage
      - name: Prove the coverage validator rejects CI bypasses
        run: pnpm run validate:ci-bypass-fixtures
      - name: Prove the governance checks reject documentation drift
        run: pnpm run validate:governance-fixtures
      - name: Scan for committed secrets
        run: node tools/scan-secrets.mjs

  verify:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test:unit
      - name: Build all applications
        run: pnpm run build
      - name: Generate OpenAPI document
        run: pnpm run openapi
      # Blocking. Anything a production install would ship must be clean at
      # moderate and above. See docs/implementation/dependency-security-register.md.
      - name: Audit production dependencies
        run: pnpm run audit:prod
      # Advisory. The development tree carries GHSA-67mh-4wv8-2f99 through
      # drizzle-kit's deprecated @esbuild-kit chain; it is contained, not shipped,
      # and must not block every phase. Registered, reviewed in Phases 20 and 22.
      - name: Audit full dependency tree
        run: pnpm run audit:tree

  e2e:
    name: portal shell end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Portal shell smoke tests
        run: pnpm run test:e2e

  compose:
    name: compose services, migrations and health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Validate compose configuration
        run: docker compose config --quiet
      - name: Start backing services
        run: docker compose up -d --wait
      # `dist/` is ignored, and several suites consume generated JavaScript —
      # the migration and bootstrap child processes require it by path. Building
      # here means every gate below runs against this checkout's source and not
      # against whatever happened to be left in a cache.
      - name: Build workspace packages from this checkout
        run: pnpm run build
      # GATE-MIGR, GATE-INTEG and GATE-CONC all need a real server. They run in
      # this job because it is the one that has one (CLAUDE.md §10).
      - name: Migration gate against real PostgreSQL
        run: pnpm run test:migrations
        env:
          DATABASE_URL: postgresql://prsystem:prsystem_local_dev@127.0.0.1:55442/prsystem
      - name: Integration gate against real PostgreSQL
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://prsystem:prsystem_local_dev@127.0.0.1:55442/prsystem
      - name: Concurrency gate against real PostgreSQL
        run: pnpm run test:concurrency
        env:
          DATABASE_URL: postgresql://prsystem:prsystem_local_dev@127.0.0.1:55442/prsystem
      - name: Complete regression suite against real PostgreSQL
        run: pnpm run test:regression
        env:
          DATABASE_URL: postgresql://prsystem:prsystem_local_dev@127.0.0.1:55442/prsystem
      - name: Prove an unexpected idle-pool error fails an ordinary suite
        run: pnpm run validate:pool-error-fixture
        env:
          DATABASE_URL: postgresql://prsystem:prsystem_local_dev@127.0.0.1:55442/prsystem
      - name: Report service state
        if: always()
        run: docker compose ps
      - name: Stop backing services
        if: always()
        run: docker compose down -v

  # A distinct job, so its display name is a selectable branch-protection check.
  # A step inside another job is not: only the job name appears in the required
  # checks list. Branch protection itself is a repository setting and is
  # deliberately not configured here.
  gate-sec:
    name: GATE-SEC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Start backing services
        run: docker compose up -d --wait
      # `pnpm run test:security` builds first for the same reason, but building
      # explicitly keeps the failure legible when it is a compile error.
      - name: Build workspace packages from this checkout
        run: pnpm run build
      # Fails closed: unavailable database, skipped suite, zero-test sub-gate or
      # missing artefact each fail the job rather than passing quietly.
      - name: Run the fail-closed security aggregator
        run: pnpm run test:security
        env:
          DATABASE_URL: postgresql://prsystem:prsystem_local_dev@127.0.0.1:55442/prsystem
      - name: Stop backing services
        if: always()
        run: docker compose down -v
